<div class="job-opening-form">
    <h2>Post Job Openings</h2>
    <form [formGroup]="jobForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="jobTitle">Job Title:</label>
            <select id="jobTitle" formControlName="jobTitle" (input)="filterJobTitles($event)">
                <option value="" disabled>Select or Search Job Title</option>
                <option *ngFor="let title of jobTitles">{{ title }}</option>
            </select>
        </div>

        <div>
            <label for="companyName">Company Name:</label>
            <select id="companyName" formControlName="companyName" (input)="filterCompanyNames($event)">
                <option value="" disabled>Select or Search Company Name</option>
                <option *ngFor="let company of companyNames">{{ company }}</option>
            </select>
        </div>

        <div>
            <label for="location">Location:</label>
            <select id="location" formControlName="location" (input)="filterLocations($event)">
                <option value="" disabled>Select or Search Location</option>
                <option *ngFor="let location of locations">{{ location }}</option>
            </select>
        </div>

        <div>
            <label for="salary">Salary:</label>
            <input id="salary" formControlName="salary" type="number" placeholder="Enter Salary" />
        </div>

        <div>
            <label for="jobDescription">Job Description:</label>
            <textarea id="jobDescription" formControlName="jobDescription" placeholder="Enter Job Description"></textarea>
        </div>

        <button class="jobPortalBtn" type="submit" [disabled]="jobForm.invalid">Create Job</button>
    </form>
</div>
<div class="container">
    <h2>Posted Jobs</h2>
    <div class="job-panel">
        <div class="job-card" *ngFor="let job of jobListData">
            <h3>{{ job.jobTitle }}</h3>
            <p><strong>Company:</strong> {{ job.companyName }}</p>
            <p><strong>Location:</strong> {{ job.location }}</p>
            <p><strong>Salary:</strong> {{ job.salary }}</p>
            <p>{{ job.jobDescription }}</p>
        </div>  
</div>
<div class="container">
    <h2>Applications Recivied</h2>
    <div class="job-panel">
        <div class="job-card" *ngFor="let job of applicationsData">
            <h3>{{ job.jobTitle }}</h3>
            <p><strong>Seeker Email:</strong> {{ job.seeker_email }}</p>
            <p><strong>Applied On:</strong> {{ job.applied_at | date:'yyyy-MM-dd' }}</p>

        </div>
</div>
